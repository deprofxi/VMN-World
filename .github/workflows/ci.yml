name: VMNL Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Verification & Testing Pyramid
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vmn_user
          POSTGRES_PASSWORD: vmn_test_password
          POSTGRES_DB: vmn_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vmn_user:vmn_test_password@localhost:5432/vmn_test_db
      JWT_SECRET: vmnl_ci_test_jwt_secret_must_be_at_least_32_characters_long
      AZEEBO_WEBHOOK_SECRET: azeebo_test_secret_16_chars

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # AUD-27: version resolved from the packageManager field — no drift
          # between local, CI, and container builds.
          package_json_file: package.json
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret Scan (gitleaks) (AUD-31)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Static Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      - name: Lint Check
        run: pnpm run lint

      - name: Dependency Audit (production) (AUD-10, AUD-23)
        run: pnpm run audit:check

      - name: Dependency Vulnerability Threshold (AUD-21)
        run: pnpm run audit:threshold

      - name: Explicit-any Ratchet Gate (AUD-12/AUD-18)
        run: pnpm run any:budget

      - name: Apply Database Migrations (Prisma)
        run: pnpm exec prisma migrate deploy

      - name: Run Test Pyramid & 20 UAT Drills with Coverage (AUD-25)
        run: pnpm run test:coverage

      - name: Compile Production Build
        run: pnpm run build

      - name: Evaluate BG0-BG9 Broadcast Release Gates (R1.2A §67)
        run: node dist/src/cli/index.js gates:check

      - name: Build Production Container Image
        run: docker build -t vmnl-platform:ci-test .

      - name: Container Security Scan (Trivy) (AUD-19 / AUD-33)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0 (post-2026-03 compromise)
        with:
          image-ref: 'vmnl-platform:ci-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

