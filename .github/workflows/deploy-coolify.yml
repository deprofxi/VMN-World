name: Build Image & Deploy to Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Publish Container Image (GHCR)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate All-in-One Compose & Bootstrap Env
        run: |
          test -f ./docker/backups/backup.sh
          test -f ./prometheus.yml
          test -f ./prometheus.rules.yml
          sh scripts/bootstrap-env.sh /tmp/bootstrap.env
          docker compose --env-file /tmp/bootstrap.env config -q
          rm -f /tmp/bootstrap.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync Auto-Generated Credentials to Coolify (Optional)
        if: env.COOLIFY_API_URL != '' && env.COOLIFY_API_TOKEN != '' && env.COOLIFY_RESOURCE_UUID != ''
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
          COOLIFY_RESOURCE_TYPE: ${{ secrets.COOLIFY_RESOURCE_TYPE }}
        run: node scripts/bootstrap-env.mjs --coolify

      - name: Trigger Coolify Webhook (Optional Auto-Deploy)
        if: env.COOLIFY_WEBHOOK != ''
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          echo "Triggering Coolify deployment webhook..."
          curl -sS -X POST "$COOLIFY_WEBHOOK" || echo "Webhook trigger completed with notice."
