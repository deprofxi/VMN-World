# Local Development & Sandbox Services
# Authority: VMNL-AZP-VMN-CCPP-001 / T9-20 (F-9-20)
#
# AUD-14: security-bearing variables carry NO default secrets. The application
# fails fast on missing required secrets (CR-6) instead of booting with
# publicly-known values. Sandbox infrastructure passwords (postgres/minio) are
# explicitly non-production and documented as such.
# PR-20: the deployed hardening baseline, as a merge anchor so it cannot be
# applied to one service and forgotten on the next.
#
#   hardening-full — for images that need no privilege at all: the application
#     (non-root uid 1001, binds 5500, writes nothing outside /tmp) and
#     Prometheus (runs as nobody, writes only its own volume).
#   hardening-init — for the stateful images whose entrypoints legitimately need
#     capabilities while initialising a FRESH volume (postgres chowns/`chmod`s
#     its data directory, MinIO and Redis write as their image user). Dropping
#     all capabilities there would break first-run initialisation, and this host
#     has no Docker to rehearse it, so those two are deferred and recorded as
#     still open in the PR-20 register entry rather than asserted.
#
# `no-new-privileges` is safe on every service: it does not remove a capability
# the process already holds, it blocks gaining more through a setuid binary.
x-hardening-full: &hardening-full
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-hardening-init: &hardening-init
  security_opt:
    - no-new-privileges:true

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-ghcr.io/deprofxi/vmn-world:latest}
    container_name: vmnl-enterprise-app
    restart: unless-stopped
    <<: *hardening-full
    # PR-20: nothing the application writes needs to survive the container, so
    # the root filesystem can be read-only with a scratch /tmp. Revert to a
    # writable filesystem by deleting these three lines if a future dependency
    # needs one — the reverse is not true, which is why it is the default here.
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    ports:
      - "${HOST_PORT:-127.0.0.1:5500}:${PORT:-5500}"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-5500}
      - APP_NAME=${APP_NAME:-VMN World}
      - APP_URL=${APP_URL:-http://localhost:5500}
      # Compose container DNS must target postgres; host-run dev uses localhost.
      # Password is the explicitly sandbox-only value configured on the postgres service.
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-vmn_user}:${POSTGRES_PASSWORD:-vmn_sandbox_only_password}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-vmn_enterprise}?schema=public}
      # Required in all environments: no default JWT secret (AUD-14).
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required, min 32 chars (see .env.example)}
      - JWT_EXPIRATION_SECONDS=${JWT_EXPIRATION_SECONDS:-86400}
      # Required: no default webhook secret.
      - AZEEBO_WEBHOOK_SECRET=${AZEEBO_WEBHOOK_SECRET:?AZEEBO_WEBHOOK_SECRET is required (see .env.example)}
      - DATABASE_POOL_MIN=${DATABASE_POOL_MIN:-2}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-20}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # TODO-SEC-10: the distributed KV adapter (cache/session/rate-limit
      # stores) prefers REDIS_URL; authenticated with the compose Redis
      # password (AUD-22) so a Redis on the shared network is never open.
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required (see .env.example)}@redis:6379}
      # Storage credentials for the local sandbox MinIO (non-production only).
      - STORAGE_DRIVER=${STORAGE_DRIVER:-minio}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-http://minio:9000}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-vmnl-assets}
      # PR-20: required, not defaulted, and the same variables the MinIO service
      # below reads. The pre-fix state had the app default to
      # `minioadmin_secure_key` while MinIO hard-coded that same literal and
      # `.env.example` shipped `minioadmin` — so the documented sandbox path
      # authenticated against nothing. One required source removes the class.
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required (see .env.example)}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required (see .env.example)}
      - PROMETHEUS_METRICS_ENABLED=${PROMETHEUS_METRICS_ENABLED:-true}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - AUTO_SEED=${AUTO_SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vmnl-network

  postgres:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    container_name: vmnl-postgres
    restart: unless-stopped
    <<: *hardening-init
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    environment:
      # Sandbox-local credentials; NEVER mirror production values here.
      - POSTGRES_USER=${POSTGRES_USER:-vmn_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vmn_sandbox_only_password}
      - POSTGRES_DB=${POSTGRES_DB:-vmn_enterprise}
    ports:
      - "${POSTGRES_HOST_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vmn_user} -d $${POSTGRES_DB:-vmn_enterprise}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vmnl-network

  # AUD-08: Redis service added. REDIS_* configuration and the BullMQ message
  # bus contract are first-class in src/core/config; the compose stack must
  # provide the dependency for parity between sandbox and deployment topology.
  # AUD-22: Redis requires an authenticated password — compose refuses to boot
  # without REDIS_PASSWORD (sandbox default ships in .env.example), and the
  # healthcheck authenticates. Loopback-bound, but defence-in-depth against
  # any future port exposure or shared-network join.
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: vmnl-redis
    restart: unless-stopped
    <<: *hardening-init
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required (see .env.example)}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required (see .env.example)}
    ports:
      - "${REDIS_HOST_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vmnl-network

  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-09-07T16-19-51Z}
    container_name: vmnl-minio
    restart: unless-stopped
    <<: *hardening-init
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    command: server /data --console-address ":9001"
    environment:
      # PR-20: no literal fallbacks. These are the same two variables the app
      # service is given, so the sandbox cannot end up with the store expecting
      # one credential and the client sending another.
      - MINIO_ROOT_USER=${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required (see .env.example)}
      - MINIO_ROOT_PASSWORD=${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required (see .env.example)}
    ports:
      - "${MINIO_API_PORT:-127.0.0.1:9000}:9000"
      - "${MINIO_CONSOLE_PORT:-127.0.0.1:9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vmnl-network

  # TODO-PRC-08 (TASK-P10-03): nightly 02:00 WAT PostgreSQL backup with
  # integrity verification and 14-day retention. WAL archiving (true PITR)
  # remains TARGET-state — see docs/runbooks/disaster-recovery.md and
  # docs/audit/backup-restore-drill.md for the drill evidence protocol.
  postgres-backup:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    container_name: vmnl-postgres-backup
    restart: unless-stopped
    <<: *hardening-init
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    # AUD-22: run the backup job as the image's non-root postgres user (uid 70).
    # The backup volume mounts at /var/lib/postgresql/backups — a directory that
    # exists in the image owned by uid 70 — so the named volume initialises
    # with writable non-root ownership.
    user: "70:70"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=${PGHOST:-postgres}
      - PGPORT=${PGPORT:-5432}
      - PGUSER=${POSTGRES_USER:-vmn_user}
      - PGPASSWORD=${POSTGRES_PASSWORD:-vmn_sandbox_only_password}
      - PGDATABASE=${POSTGRES_DB:-vmn_enterprise}
      - VMNL_BACKUP_DIR=/var/lib/postgresql/backups
      - VMNL_BACKUP_RETENTION_DAYS=${VMNL_BACKUP_RETENTION_DAYS:-14}
      - TZ=${TZ:-Africa/Lagos}
    volumes:
      - ./docker/backups/backup.sh:/usr/local/bin/backup.sh:ro
      - pgbackups:/var/lib/postgresql/backups
    entrypoint: ["/bin/sh", "-c"]
    # AUD-20: crond-based scheduler (replaces drift-prone sleep loop).
    # Runs at 02:00 WAT daily. TZ=Africa/Lagos is set in environment.
    # AUD-22: non-root — the crontab lives in a writable dir passed via
    # `crond -c`; busybox crond setuids to the file's owner (already uid 70).
    command:
      - |
        mkdir -p /tmp/vmnl-cron
        echo '0 2 * * * /bin/sh /usr/local/bin/backup.sh && touch /var/lib/postgresql/backups/.last_run' > /tmp/vmnl-cron/postgres
        [ ! -f /var/lib/postgresql/backups/.last_run ] && /bin/sh /usr/local/bin/backup.sh && touch /var/lib/postgresql/backups/.last_run
        exec crond -f -l 2 -c /tmp/vmnl-cron
    networks:
      - vmnl-network

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.53.0}
    container_name: vmnl-prometheus
    restart: unless-stopped
    <<: *hardening-full
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # PR-21: the alert rules are shipped as a real file and mounted, so the
      # rules the runbook documents are the rules Prometheus evaluates.
      - ./prometheus.rules.yml:/etc/prometheus/prometheus.rules.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-127.0.0.1:9090}:9090"
    depends_on:
      - app
    networks:
      - vmnl-network

networks:
  vmnl-network:
    driver: bridge

volumes:
  pgdata:
  pgbackups:
  miniodata:
  promdata:
  redisdata:
